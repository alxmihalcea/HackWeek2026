<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cd.connatix.com/sax.sdk.js?cid=daceb440-4162-43ed-b259-7f91be8606f9"></script>
  </head>
  <body
    style="
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: black;
      font-family: sans-serif;
      position: relative;
    "
  >
    <div id="ad-container" style="width: 100%; height: 100%"></div>

    <button
      id="close-button"
      onclick="closeAd()"
      style="
        border-radius: 1000px;
        width: 30px;
        height: 30px;
        background-color: rgba(116, 116, 116, 0.5);
        font-size: 18px;
        font-weight: 500;
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        display: none;
      "
    >
      x
    </button>

    <button
      id="skip-button"
      onclick="skipAd()"
      style="
        border-radius: 1000px;
        padding: 8px 30px;
        background-color: rgba(116, 116, 116, 0.5);
        font-size: 18px;
        font-weight: 500;
        position: absolute;
        bottom: 10px;
        right: 10px;
        z-index: 1000;
        display: none;
      "
    >
      Skip
    </button>

    <p id="logs"></p>

    <script>
      function closeAd() {
        if (window.AndroidBridge && window.AndroidBridge.closeWebView) {
          window.AndroidBridge.closeWebView();
        }
      }

      function showCloseButton() {
        const closeButton = document.getElementById("close-button");
        if (closeButton) {
          closeButton.style.display = "block";
        }
      }

      function showSkipButton() {
        const skipButton = document.getElementById("skip-button");
        if (skipButton) {
          skipButton.style.display = "block";
        }
      }
    </script>
    <script src="adServerSdkHandler.js"></script>
  </body>
</html>
